<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three Black Circle Buttons</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #f0f0f0;
    }

    body {
      display: flex;
      justify-content: center;
      background-color: #f0f0f0;
    }

    .wrapper {
      position: relative;
      height: 100%;
      width: 100%;
    }

    .button-container {
      position: absolute;
      top: 40px; /* Initially 1cm from the top */
      left: 50%;
      transform: translate(-50%, 0);
      display: flex;
      gap: 40px;
      transition: top 1s ease-in-out; /* Transition for sliding down */
    }

    .slide-down {
      top: calc(45% - 18px); /* Move to 45% from the top */
    }

    .circle-button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: black;
      border: none;
      cursor: pointer;
    }

    .circle-button:hover {
      background-color: #333;
    }

  </style>
</head>
<body>

  <div class="wrapper">
    <div class="button-container" id="menu">
      <button class="circle-button" id="btn-index" onclick="indexAction()"></button>
      <button class="circle-button" onclick="animateAndGo('menu2.html')"></button>
      <button class="circle-button" onclick="animateAndGo('menu3.html')"></button>
    </div>
  </div>

  <!-- Error sound (Make sure the path is correct) -->
  <audio id="error-sound" src="pop.mp3" preload="auto"></audio>

  <script>
    // Function to animate menu and go to URL
    function animateAndGo(url) {
      const menu = document.getElementById('menu');
      menu.classList.add('slide-down');

      setTimeout(() => {
        window.location.href = url;
      }, 1000); // Match animation duration before redirecting
    }

    // Function to handle index button click (shake & error sound)
    function indexAction() {
      const btnIndex = document.getElementById('btn-index');

      // Add shaking effect
      btnIndex.classList.add('shake');

      // Play error sound
      const errorSound = document.getElementById('error-sound');
      errorSound.play();

      // Remove the shake class after the animation ends so it can be triggered again
      setTimeout(() => {
        btnIndex.classList.remove('shake');
      }, 200); // Shake duration (same as animation duration)
    }

    // On page load, trigger the slide-down animation and then redirect to index.html
    window.onload = () => {
      const menu = document.getElementById('menu');
      menu.classList.add('slide-down');

      // Redirect after animation completes (1 second)
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1000); // Match animation duration before redirecting
    }
  </script>

</body>
</html>
