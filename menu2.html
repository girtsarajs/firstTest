  const db = firebase.firestore();

<script>
  fetch('https://api.ipify.org?format=json')
    .then(res => res.json())
    .then(async data => {
      const ip = data.ip;
      const ipRef = db.collection("visitors").doc(ip);

      const doc = await ipRef.get();
      if (!doc.exists) {
        // New visitor: add IP
        await ipRef.set({ visited: true });

        // Increment the count
        const counterRef = db.collection("counter").doc("doc");
        await counterRef.update({
          count: firebase.firestore.FieldValue.increment(1)
        });
      }

      // Show count
      db.collection("counter").doc("doc").get().then((doc) => {
        document.getElementById("counter").textContent = doc.data().count;
      });
    });
</script>

    function moveMenu(page, button) {
      const menu = document.querySelector('.button-container');

        if (page === 'menu2.html') {

        } else if (page === 'index.html') {
                      // Get the background color from CSS based on the page
