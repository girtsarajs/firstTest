<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Girts Arajs - Data base</title>
  <link rel="stylesheet" href="styles_database.css">
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-7YBH6VMPT0"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-7YBH6VMPT0');
</script>
<body>
  <div class="background">
    <p>database experiments (firebase):</p><br>
    
    <p>total visits: <span id="totalVisits">0</span></p>
    <p>unique visitors: <span id="uniqueVisitors">0</span></p>
    <p>top 5 visitor visits:</p>
    <p><ol id="topVisitorsList"></ol></p>

  <!-- Firebase SDK and Config (as explained in the previous steps) -->
  <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>
  <script>
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries
      
        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
          apiKey: "AIzaSyBd9PU1NnvZHSy7ZlQCbGMSgLLw_kt54Z4",
          authDomain: "girtsarajs-id-lv-count.firebaseapp.com",
          projectId: "girtsarajs-id-lv-count",
          databaseURL: "https://girtsarajs-id-lv-count-default-rtdb.europe-west1.firebasedatabase.app/",
          storageBucket: "girtsarajs-id-lv-count.firebasestorage.app",
          messagingSenderId: "1051015379682",
          appId: "1:1051015379682:web:b0e295924108addc463cbb",
          measurementId: "G-R37XW1PZLK"
        };
      
        firebase.initializeApp(firebaseConfig);
          const database = firebase.database();

          // Function to get or generate a visitor ID
          function getVisitorId() {
            let visitorId = localStorage.getItem("visitorId");
            if (!visitorId) {
              visitorId = generateId(); // Generate a unique ID
              localStorage.setItem("visitorId", visitorId);
            }
            return visitorId;
          }

          // Generate a unique ID
          function generateId() {
            return Math.random().toString(36).substring(2, 15);
          }

          const visitorId = getVisitorId();

          // Update total visits
          const totalVisitsRef = firebase.database().ref("totalVisits");
          totalVisitsRef.transaction((currentValue) => {
            return (currentValue || 0) + 1;
          });

          // Reference to unique visitors count
          const uniqueVisitorCountRef = firebase
            .database()
            .ref("uniqueVisitorCount");

          // Update unique visitor visits
          const visitorRef = firebase
            .database()
            .ref("visitors/" + visitorId + "/visits");

          visitorRef.transaction((currentValue) => {
            return (currentValue || 0) + 1;
          });

          // Update unique visitor count (only on first visit)
          const uniqueVisitorsRef = firebase
            .database()
            .ref("uniqueVisitors/" + visitorId);

          uniqueVisitorsRef.once("value", (snapshot) => {
            if (!snapshot.exists()) {
              uniqueVisitorCountRef.transaction((count) => {
                return (count || 0) + 1;
              });
              uniqueVisitorsRef.set(true);
            }
          });

          // Read and display counts
          firebase
            .database()
            .ref("totalVisits")
            .on("value", (snapshot) => {
              document.getElementById("totalVisits").innerText = snapshot.val();
            });

          firebase
            .database()
            .ref("uniqueVisitorCount")
            .on("value", (snapshot) => {
              document.getElementById("uniqueVisitors").innerText =
                snapshot.val();
            });

          // Get the top 5 visitors
          const topVisitorsRef = firebase.database().ref("visitors");
          topVisitorsRef
            .orderByChild("visits")
            .limitToLast(5)
            .on("value", (snapshot) => {
              const visitors = snapshot.val();
              const topVisitorsList = document.getElementById("topVisitorsList");
              topVisitorsList.innerHTML = "";

              if (visitors) {
                // Convert visitors object to an array
                const visitorsArray = Object.entries(visitors).map(
                  ([visitorId, data]) => ({
                    visitorId: visitorId,
                    visits: data.visits,
                  })
                );

                // Sort the array in descending order of visits
                visitorsArray.sort((a, b) => b.visits - a.visits);

                // Display the top 5 visitors
                visitorsArray.forEach((visitor) => {
                  const listItem = document.createElement("li");
                  listItem.textContent =
                    //"Visitor " + visitor.visitorId + ": " + visitor.visits;
                    visitor.visits;

                  topVisitorsList.appendChild(listItem);
                });
              }
            });

      </script>

  </div>
  
</body>
</html>
