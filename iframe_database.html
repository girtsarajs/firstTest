          function getVisitorId() {

          // Get the top 5 visitors
const topVisitorsRef = firebase.database().ref("visitors");
topVisitorsRef
  .orderByChild("visits")
  .limitToLast(5)
  .on("value", (snapshot) => {
    const visitors = snapshot.val();
    const topVisitorsList = document.getElementById("topVisitorsList");
    topVisitorsList.innerHTML = "";

    if (visitors) {
      // Convert visitors object to an array
      const visitorsArray = Object.entries(visitors).map(
        ([visitorId, data]) => ({
          visitorId: visitorId,
          visits: data.visits,
        })
      );

      // Sort the array in descending order of visits
      visitorsArray.sort((a, b) => b.visits - a.visits);

      // Create a single string with top 5 visits separated by "/"
      const topVisitorsString = visitorsArray
        .map((visitor) => `${visitor.visits}`)
        .join(" / ");

      // Display the top 5 visitors in one line
      topVisitorsList.textContent = topVisitorsString;
    }
  });

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>

<script>
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Function to submit a comment
  function submitComment() {
    const comment = document.getElementById("commentInput").value.trim();
    if (comment.length === 0) return;

    const timestamp = new Date().toISOString();
    db.ref("comments").push({
      text: comment,
      timestamp: timestamp
    });

    document.getElementById("commentInput").value = "";
  }

  // Add event listener to submit comment on Enter key press
  document.getElementById("commentInput").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      event.preventDefault(); // Prevent new line on Enter
      submitComment();
    }
  });

  // Listen to new comments and update the comment list
  db.ref("comments").on("value", (snapshot) => {
    const comments = snapshot.val();
    const list = document.getElementById("commentList");
    const totalComments = document.getElementById("totalComments");
    list.innerHTML = "";

    if (comments) {
      const sorted = Object.values(comments).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      // Update total comments count
      totalComments.textContent = Object.keys(comments).length;

      // Display the last 10 comments
      const last10Comments = sorted.slice(0, 10);
      last10Comments.forEach(comment => {
        const commentDiv = document.createElement("div");
        commentDiv.textContent = comment.text;
        list.appendChild(commentDiv);
      });
    }
  });
</script>
