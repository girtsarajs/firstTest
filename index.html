<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three Black Circle Buttons</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      gap: 1cm;
      background-color: #f0f0f0;
    }

    .circle-button {
      width: 1cm;
      height: 1cm;
      border-radius: 50%;
      background-color: black;
      border: none;
      cursor: pointer;
    }

    .circle-button:hover {
      background-color: #333;
    }
  </style>
</head>
<body>

  <button class="circle-button"></button>
  <button class="circle-button"></button>
  <button class="circle-button"></button>

</body>
</html>
