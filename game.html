<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Girts Arajs - laser game</title>
  <link rel="icon" type="image/png" href="images/favicon_index.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="game" style="min-height: 760px">
  <div class="button-container">
    <button class="circle-button" onclick="moveMenu('index.html', this)"></button>
    <button class="circle-button" onclick="moveMenu('menu2.html', this)"></button>
    <button class="circle-button" onclick="moveMenu('game.html', this)"></button>
    <button class="circle-button" onclick="moveMenu('about_me.html', this)"></button>
  </div>

  <div class="iframe-wrapper">
    <!-- Automatically load index.html on page load -->
    <iframe id="contentFrame" src="iframe_game.html" title="Embedded Page"></iframe>
  </div>

  <script>
    function loadPage(url) {
      const iframeWrapper = document.getElementById('iframe-wrapper');
      const iframe = document.getElementById('content-frame');

      // Set the iframe source
      iframe.src = url;

      // Check if the iframe is at its minimum height
      iframe.onload = function() {
        if (iframeWrapper.clientHeight >= 600) {
          iframeWrapper.classList.add('min-height-reached');
        } else {
          iframeWrapper.classList.remove('min-height-reached');
        }
      };
    }
  </script>

  <script>
    function moveMenu(page, button) {
      const menu = document.querySelector('.button-container');
      const iframeWrapper = document.querySelector('.iframe-wrapper');


        if (page === 'game.html') {
            /*window.location.href = page;*/
            return; // Skip animation and immediate page load
        } else if (page === 'index.html') {
                      // Get the background color from CSS based on the page
          let pagee = page.slice(0, -5); // Remove '.html' from the page name
          let newBackgroundColor = getComputedStyle(document.documentElement).getPropertyValue(`--${pagee}-background`);

          // Remove any extra whitespace
          newBackgroundColor = newBackgroundColor.trim();

          // Set the background color with a smooth transition
          document.body.style.transition = 'background-color 1s ease'; // Smooth transition for background color
          document.body.style.backgroundColor = newBackgroundColor;

           // Fade out the iframe with a smooth transition
          iframeWrapper.style.transition = 'opacity 1s ease';
          iframeWrapper.style.opacity = '0'; // Fade out the iframe

            let topPosition = 45; // default for menu3 and menu2
            // Add class for transition
            menu.style.transition = 'top 1s ease'; // Add transition for movement
            menu.style.top = `${topPosition}%`;

           
        }  else {
                      // Get the background color from CSS based on the page
          let pagee = page.slice(0, -5); // Remove '.html' from the page name
          let newBackgroundColor = getComputedStyle(document.documentElement).getPropertyValue(`--${pagee}-background`);

          // Remove any extra whitespace
          newBackgroundColor = newBackgroundColor.trim();

          // Set the background color with a smooth transition
          document.body.style.transition = 'background-color 1s ease'; // Smooth transition for background color
          document.body.style.backgroundColor = newBackgroundColor;

             // Fade out the iframe with a smooth transition
        iframeWrapper.style.transition = 'opacity 1s ease';
        iframeWrapper.style.opacity = '0'; // Fade out the iframe

            let topPosition = 40; // default for menu2 - ..     
            // Add class for transition
            menu.style.transition = 'top 1s ease'; // Add transition for movement
            menu.style.top = `${topPosition}px`;
        }
            // After the animation is complete, change the location
            setTimeout(() => {
            window.location.href = page;
            }, 1000); // Match animation duration
        
    }
  </script>

</body>
</html>
