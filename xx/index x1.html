<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three Black Circle Buttons</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #f0f0f0;
    }

    body {
      display: flex;
      justify-content: center;
      background-color: #f0f0f0;
    }

    .wrapper {
      position: relative;
      height: 100%;
      width: 100%;
    }

    .button-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 1cm;
      transition: top 1s ease-in-out;
    }

    .slide-up {
      top: 1cm; /* Only top changes, transform stays same */
    }

    .circle-button {
      width: 1cm;
      height: 1cm;
      border-radius: 50%;
      background-color: black;
      border: none;
      cursor: pointer;
    }

    .circle-button:hover {
      background-color: #333;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="button-container" id="menu">
      <button class="circle-button" onclick="animateAndGo('index.html')"></button>
      <button class="circle-button" onclick="animateAndGo('menu2.html')"></button>
      <button class="circle-button" onclick="animateAndGo('menu3.html')"></button>
    </div>
  </div>

  <script>
    function animateAndGo(url) {
      const menu = document.getElementById('menu');
      menu.classList.add('slide-up');

      setTimeout(() => {
        window.location.href = url;
      }, 1000); // match animation duration
    }
  </script>

</body>
</html>
