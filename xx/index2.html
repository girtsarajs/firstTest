<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three Black Circle Buttons</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #f0f0f0;
    }

    body {
      display: flex;
      justify-content: center;
      background-color: #f0f0f0;
    }

    .wrapper {
      position: relative;
      height: 100%;
      width: 100%;
    }

    .button-container {
      position: absolute;
      top: 45%; /* 45% from top */
      left: 50%;
      transform: translate(-50%, -45%);
      display: flex;
      gap: 1cm;
      transition: top 1s ease-in-out;
    }

    .slide-up {
      top: 1cm; /* Only top changes, transform stays same */
    }

    .circle-button {
      width: 1cm;
      height: 1cm;
      border-radius: 50%;
      background-color: black;
      border: none;
      cursor: pointer;
    }

    .circle-button:hover {
      background-color: #333;
    }

    /* Faster shaking animation */
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    .shake {
      animation: shake 0.2s ease-in-out; /* Faster shake */
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="button-container" id="menu">
      <button class="circle-button" id="btn-index" onclick="indexAction()"></button>
      <button class="circle-button" onclick="animateAndGo('menu2.html')"></button>
      <button class="circle-button" onclick="animateAndGo('menu3.html')"></button>
    </div>
  </div>

  <!-- Error sound (Make sure the path is correct) -->
  <audio id="error-sound" src="pop.mp3" preload="auto"></audio>

  <script>
    // Function to animate menu and go to URL
    function animateAndGo(url) {
      const menu = document.getElementById('menu');
      menu.classList.add('slide-up');

      setTimeout(() => {
        window.location.href = url;
      }, 1000); // match animation duration
    }

    // Function to handle index button click (shake & error sound)
    function indexAction() {
      const btnIndex = document.getElementById('btn-index');

      // Add shaking effect
      btnIndex.classList.add('shake');

      // Play error sound
      const errorSound = document.getElementById('error-sound');
      errorSound.play();

      // Remove the shake class after the animation ends so it can be triggered again
      setTimeout(() => {
        btnIndex.classList.remove('shake');
      }, 200); // Shake duration (same as animation duration)
    }
  </script>

</body>
</html>
