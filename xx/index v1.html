<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three Black Circle Buttons</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #f0f0f0;
    }

    body {
      display: flex;
      justify-content: center;
      background-color: #f0f0f0;
    }

    .wrapper {
      position: relative;
      height: 100%;
      width: 100%;
    }

    .button-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 1cm;
      transition: top 1s ease-in-out;
    }

    .slide-up {
      top: 1cm;
    }

    .circle-button {
      width: 1cm;
      height: 1cm;
      border-radius: 50%;
      background-color: black;
      border: none;
      cursor: pointer;
      position: relative;
      transition: transform 0.5s;
    }

    .circle-button:hover {
      background-color: #333;
    }

    /* animation class */
    .move-right {
      animation: moveRightOut 0.5s forwards, moveLeftIn 0.5s 0.5s forwards;
    }

    @keyframes moveRightOut {
      to {
        transform: translateX(300%);
        opacity: 0;
      }
    }

    @keyframes moveLeftIn {
      from {
        transform: translateX(-300%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="button-container" id="menu">
      <button class="circle-button" id="btn-index" onclick="indexAction()"></button>
      <button class="circle-button" id="btn-menu2" onclick="animateAndGo('menu2.html')"></button>
      <button class="circle-button" id="btn-menu3" onclick="animateAndGo('menu3.html')"></button>
    </div>
  </div>

  <script>
    function animateAndGo(url) {
      const menu = document.getElementById('menu');
      menu.classList.add('slide-up');

      setTimeout(() => {
        window.location.href = url;
      }, 1000);
    }

    function indexAction() {
      const btnIndex = document.getElementById('btn-index');
      const btnMenu2 = document.getElementById('btn-menu2');
      const btnMenu3 = document.getElementById('btn-menu3');

      // Step 1: Animate menu3 moving
      btnMenu3.classList.add('move-right');

      // Step 2: After animation, swap their positions visually
      setTimeout(() => {
        // Clone buttons to simulate shuffling
        const newIndex = btnMenu2.cloneNode(true);
        newIndex.id = 'btn-index';
        newIndex.onclick = indexAction;

        const newMenu2 = btnMenu3.cloneNode(true);
        newMenu2.id = 'btn-menu2';
        newMenu2.onclick = () => animateAndGo('menu2.html');
        newMenu2.classList.remove('move-right'); // clean animation

        const newMenu3 = btnIndex.cloneNode(true);
        newMenu3.id = 'btn-menu3';
        newMenu3.onclick = () => animateAndGo('menu3.html');

        const container = document.getElementById('menu');
        container.innerHTML = '';
        container.appendChild(newIndex);
        container.appendChild(newMenu2);
        container.appendChild(newMenu3);
      }, 1000); // match animation duration
    }
  </script>

</body>
</html>
